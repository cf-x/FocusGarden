name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Model smoke tests
        run: |
          swiftc Sources/FocusGarden/Models.swift SmokeTests/main.swift -o .build/model-smoke
          .build/model-smoke
